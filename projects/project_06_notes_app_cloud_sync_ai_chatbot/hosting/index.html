<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#2563eb">
    <title>Shared conversation | NoteFlow</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, sans-serif;
        background: #eaf1ff;
        color: #172554;
      }
      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
      }
      main {
        box-sizing: border-box;
        width: min(90vw, 440px);
        padding: 32px;
        border: 1px solid #fff;
        border-radius: 24px;
        background: #ffffffd9;
        box-shadow: 0 16px 48px #244a8822;
      }
      a {
        display: inline-block;
        margin-top: 16px;
        padding: 12px 20px;
        border-radius: 24px;
        background: #2563eb;
        color: white;
        font-weight: 700;
        text-decoration: none;
      }
      a[aria-disabled="true"] {
        opacity: .5;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Shared conversation</h1>
      <p>This conversation is read-only. Open it in NoteFlow to view it.</p>
      <a id="open-app" href="#" aria-disabled="true">Open in NoteFlow</a>
      <p id="link-error" role="status" hidden>This share link is invalid.</p>
    </main>
    <script>
      const segments = window.location.pathname.split('/').filter(Boolean);
      const shareId = segments.length === 2 && segments[0] === 'share'
        ? segments[1]
        : '';
      const openApp = document.getElementById('open-app');
      if (/^[A-Za-z0-9_-]{20}$/.test(shareId)) {
        openApp.href = `noteflow://share/${encodeURIComponent(shareId)}`;
        openApp.removeAttribute('aria-disabled');
      } else {
        document.getElementById('link-error').hidden = false;
      }
    </script>
  </body>
</html>
