org.gradle.jvmargs=-Xmx1G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=128m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=1
kotlin.compiler.execution.strategy=in-process
# The project and Pub cache are on separate Windows drives; incremental Kotlin
# path mapping cannot relativize plugin sources across those drive roots.
kotlin.incremental=false
android.useAndroidX=true
